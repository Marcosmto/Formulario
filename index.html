<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de cadastro para desenvolvedores. Preencha suas informações profissionais.">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Cadastro de DEVs</title>
</head>

<body>

    <div class="container">
        <header>
            <h1 id="titulo">Cadastro de DEVs</h1>
            <p id="subtitulo">Complete suas informações</p>
        </header>

        <form action="#" method="post">

            <fieldset class="grupo">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" placeholder="Seu nome" required>
                </div>

                <div class="campo">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" name="sobrenome" id="sobrenome" placeholder="Seu sobrenome" required>
                </div>
            </fieldset>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="campo">
                <label class="label-titulo">De qual lado da aplicação você desenvolve?</label>
                <div class="opcoes">
                    <label>
                        <input type="radio" name="devweb" value="frontend" checked> Front-end
                    </label>
                    <label>
                        <input type="radio" name="devweb" value="backend"> Back-end
                    </label>
                    <label>
                        <input type="radio" name="devweb" value="fullstack"> Fullstack
                    </label>
                </div>
            </div>

            <div class="campo">
                <label for="senioridade">Senioridade</label>
                <select id="senioridade" name="senioridade" required>
                    <option selected disabled value="">Selecione</option>
                    <option value="junior">Júnior</option>
                    <option value="pleno">Pleno</option>
                    <option value="senior">Sênior</option>
                </select>
            </div>

            <fieldset class="grupo">
                <div class="campo" id="check">
                    <label class="label-titulo">Selecione as tecnologias que utiliza:</label>
                    <div class="tecnologias">
                        <label><input type="checkbox" name="tecnologia" value="HTML"> HTML</label>
                        <label><input type="checkbox" name="tecnologia" value="CSS"> CSS</label>
                        <label><input type="checkbox" name="tecnologia" value="JavaScript"> JavaScript</label>
                        <label><input type="checkbox" name="tecnologia" value="PHP"> PHP</label>
                        <label><input type="checkbox" name="tecnologia" value="C#"> C#</label>
                        <label><input type="checkbox" name="tecnologia" value="Python"> Python</label>
                        <label><input type="checkbox" name="tecnologia" value="Java"> Java</label>
                    </div>
                </div>
            </fieldset>

            <div class="campo">
                <label for="experiencia">Conte um pouco mais da sua experiência</label>
                <textarea rows="5" id="experiencia" name="experiencia" placeholder="Descreva sua experiência..."></textarea>
            </div>

            <button class="botao" type="submit">Concluído</button>

        </form>
    </div>

</body>

</html>
